<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle ON Testwebsite</title>
    <link rel="stylesheet" type="text/css" href="./Css/style.css">
    <link rel="stylesheet" type="text/css" href="./Css/light.css" id="modeStylesheet">
    <script src="./Script/helper.js" defer></script>
    <script src="./Script/primary.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
    <div id="lockedFromLogin" hidden>
        <button id="dev">devmode</button><br>
        <button id="lightSwitch">lightmode</button><br>
        <button id="createTrainingsPlan">Create Trainings Plan</button>
        <div id="plan-section" hidden>
            <button id="add-weekday">Wochentag hinzufügen</button>
            <table>
                <thead>
                    <tr>
                        <th>Day of Week</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Muscle Group</th>
                        <th>&emsp;</th>
                        <th>&emsp;</th>
                    </tr>
                </thead>
                <tbody id="plan-table"></tbody>
            </table>
            <div id="exercise-tables"></div>
        </div>
    </div>
    <input type="checkbox" id="viewingSession">session<br>
    <input type="checkbox" id="viewingRealTime">real-time<br>
    <input type="checkbox" id="viewingLongterm">long-term<br>
    <br>
    <button id='deleteUserButton'>Delete Account</button>
    <a href="./index.html" id="returnLink">Go Back</a>
