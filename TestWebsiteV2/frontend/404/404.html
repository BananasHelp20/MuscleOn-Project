<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      max-width: 980px;
      width: 95%;
    }
    h1 { font-size: 64px; margin: 0; color: #222; }
    p { color: #555; margin: 10px 0 20px; }
    canvas {
      width: 100%;
      max-width: 900px;
      background: #fafafa;
      border: 2px solid #ddd;
      border-radius: 12px;
    }
    a {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      color: white;
      background: #111;
      padding: 12px 20px;
      border-radius: 10px;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Oh Well, 404</h1>
    <p>The page you requested does not exist. But you can play a little while you're here.</p>
    <canvas id="gameCanvas" width="900" height="260"></canvas>
    <br>
    <a href="/">Go Home</a>
  </div>
  <script src="./404_game.js"></script>
</body>
</html>
