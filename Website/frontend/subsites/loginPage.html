<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/layout.css">
    <script src="../script/siteManager.js" defer></script>
    <title>MuscleOn</title>
</head>
<body>
    <header>
        <div id="logoHolder"></div>
        <div id="actualHeaderHolder">
            <div id="title"">
                <h1 style="color: rgb(220, 220, 220);">Muscle-ON!</h1>
            </div>
            <div id="menuBar">
                <a id="menuLogo" class="menuObject" href="../index.html">
                    <img src="../images/logo.png" alt="">
                </a>
                <div id="menuTitle" class="menuObject">
                    Menü:
                </div>
                <div id="menuOptionBar">
                    <a class="menuObject menuOption" href="./">
                        About
                    </a>
                    <a class="menuObject menuOption" href="">
                        Settings
                    </a>
                    <a class="menuObject menuOption" href="">
                        Data
                    </a>
                    <a class="menuObject menuOption" href="">
                        Documentation
                    </a>
                </div>
            </div>
        </div>
    </header>
    <div class="siteBody">
        <h1>Muscle-ON</h1>
        <h2>Login or Sign Up</h2>
        <div id="loginDialog">
            dont have an Account? <button>Sign up now!</button>
            <br>
            <label for="usernameInput" id="usernameRequired" hidden>Username is required</label><br>
            <label for="usernameInput">Username:</label>
            <input type="text" id="usernameInput" placeholder="Max Mustermann" required>
            <br>
            <label for="passwordInput" id="passwordRequired" hidden>Password is required</label><br>
            <label for="passwordInput">Password:</label>
            <input type="password" id="passwordInput" placeholder="!Passme123" required>
            <br>
            <label for="weightInput">Weight (kg):</label>
            <input type="number" id="weightInput" placeholder="75">
            <br>
            <label for="sizeInput">Size (cm):</label>
            <input type="number" id="sizeInput" placeholder="180">
            <br>
            <label for="birthdayInput">Birthday:</label>
            <input type="date" id="birthdayInput" placeholder="01.01.2000">
            <br>
            <button id="submit">Login</button>
        </div>
    </div>
    <div class="background"></div>
</body>
</html>
