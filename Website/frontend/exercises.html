<!DOCTYPE html>
<html lang="en" style="background-color: #181818;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle ON!</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <link rel="stylesheet" type="text/css" href="./css/light.css" id="modeStylesheet">
    <script src="./script/initalize.js" defer></script>
    <script src="./script/localStorage.js" defer></script>
    <script src="./script/router.js" defer></script>
    <script src="./script/helper.js" defer></script>
    <script src="./script/render.js" defer></script>
    <script src="./script/game.js" defer></script>
    <script src="./script/dev.js" defer></script>
    <script src="./script/feature.js" defer></script>
    <script src="./script/primary.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body style="background-color: transparent">
    <header>
        <div id="logoHolder">
        </div>
        <div id="actualHeaderHolder">
            <div id="title">
                Muscle-ON!
            </div>
            <div id="menuBar">
                <div id="menuContainer">
                    <a id="menuLogo" class="menuObject" href="./index.html">
                        <img src="./images/logo.png" alt="">
                    </a>
                    <div id="menuTitle" class="menuObject">
                        Menu:
                    </div>
                    <div id="menuOptionBar">
                        <a class="menuObject menuOption" href="./about.html">
                            <span>About</span>
                        </a>
                        <a class="menuObject menuOption locked" href="./settings.html">
                            <span>Settings</span>
                        </a>
                        <a class="menuObject menuOption locked" href="./session.html">
                            <span>Session</span>
                        </a>
                        <a class="menuObject menuOption" href="./exercises.html">
                            <span>Exercises</span>
                        </a>
                    </div>
                    <div id="currentUser"></div>
                </div>
            </div>
        </div>
    </header>
    <div class="siteBody">
        <h1>Exercises</h1>
        Currently viewing: <button id="exerciseSwitch" class="defaultButton">All</button><br>
        <button id="addExercise" class="defaultButton lockedButton">Add New Exercise</button>
        <button id="cancelExerciseAddition" class="defaultButton" hidden>Cancel</button>
        <div id="exerciseForm" hidden>
            <label for="exerciseName">Name of Exercise: </label>
            <input type="text" id="exerciseName" name="exerciseName"><br>
            <label for="exerciseDescription">Description of Exercise:</label><br>
            <textarea name="exerciseDescription" id="exerciseDescription" rows="3"></textarea>
            <ul id="muscleGroupSelection">
                <!-- <li>group</li> -->
            </ul>
            <label for="equipment">Uses Equipment (leave blank if not): </label>
            <input type="text" name="equipment" id="equipment"><br>
            <label for="usesWeight">Uses Weight: </label>
            <input type="checkbox" name="usesWeight" id="usesWeight"><br>
            <label for="public">Visible to others: </label>
            <input type="checkbox" id="public" name="public">
        </div>
        <div id="exercises">
            <div class="exerciseObject">
                <span class="exerciseTitle">Name</span>
                <p>Description</p>
                <span class="exerciseCreatedBy">Created By User: </span><br>
                <span class="exerciseEquipment">Equipment</span><br>
                <span class="exerciseWeight">Needs Weight</span><br>
                <span class="exercisePublic">Public: </span><br>
                <dl class="muscleGroupList">
                    <dt>Muscle Groups targeted:</dt>
                    <!-- <dd class="muscleGroupListObject">musclegroup1</dd> -->
                </dl>
                <div id="actions">
                    <!-- edit und del button -->
                </div>
            </div>
        </div>
    </div>
    <div class="background"></div>
</body>
