<!DOCTYPE html>
<html lang="en" style="background-color: #181818;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle ON!</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <link rel="stylesheet" type="text/css" href="./css/light.css" id="modeStylesheet">
    <script src="./script/initalize.js" defer></script>
    <script src="./script/localStorage.js" defer></script>
    <script src="./script/router.js" defer></script>
    <script src="./script/helper.js" defer></script>
    <script src="./script/render.js" defer></script>
    <script src="./script/game.js" defer></script>
    <script src="./script/dev.js" defer></script>
    <script src="./script/feature.js" defer></script>
    <script src="./script/primary.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body style="background-color: transparent">
    <header>
        <div id="logoHolder">
        </div>
        <div id="actualHeaderHolder">
            <div id="title">
                Muscle-ON!
            </div>
            <div id="menuBar">
                <div id="menuContainer">
                    <a id="menuLogo" class="menuObject" href="./index.html">
                        <img src="./images/logo.png" alt="">
                    </a>
                    <div id="menuTitle" class="menuObject">
                        Menu:
                    </div>
                    <div id="menuOptionBar">
                        <a class="menuObject menuOption" href="./about.html">
                            <span>About</span>
                        </a>
                        <a class="menuObject menuOption locked" href="./settings.html">
                            <span>Settings</span>
                        </a>
                        <a class="menuObject menuOption locked" href="./session.html">
                            <span>Session</span>
                        </a>
                        <a class="menuObject menuOption" href="./exercises.html">
                            <span>Exercises</span>
                        </a>
                    </div>
                    <div id="currentUser"></div>
                </div>
            </div>
        </div>
    </header>
    <div class="siteBody">
        <h1>Settings</h1>
        <div id="lockedFromLogin" hidden>
            Mode: <button id="dev" class="setting defaultButton">devmode</button><br>
            Environment: <button id="lightSwitch" class="setting defaultButton">lightmode</button><br>
            Profile Settings: <button id="editProfileButton" class="setting defaultButton">Edit Profile</button>
            <button id="cancelEditProfileButton" class="setting defaultButton" hidden>Cancel</button>
            <ul id="profileSettingsList"></ul>
            Change Password: <button id="changePasswordLink" class="setting defaultButton">Change Password</button><br>
            Trainingsplan: <button id="createTrainingsPlan" class="setting defaultButton">Create Trainings Plan</button>
            <button id="cancelTrainingsPlan" class="defaultButton" hidden>Cancel</button><br>
            View Exercises: <button id="exerciseSwitch" class="setting defaultButton">All</button>
            <div id="viewSection">
                <span>Show Session data: <input type="checkbox" id="viewingSession"></span>
                <span>Show Live data: <input type="checkbox" id="viewingRealTime"></span>
                <span>Show Long-term data: <input type="checkbox" id="viewingLongterm"></span>
            </div>
            <div id="plan-section" class="table-wrapper" hidden>
                <table id="plan-table-table">
                    <thead>
                        <tr>
                            <th>Day of Week</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Muscle Group</th>
                            <th colspan="2" class="tableButtonContainer"><button id="add-weekday" class="tableButton">Add
                                    Weekday</button></th>
                        </tr>
                    </thead>
                    <tbody id="plan-table"></tbody>
                </table>
                <div id="exercise-tables" class="table-wrapper" hidden>
                    <h3>Exercises</h3>
                </div>
            </div>
            <button id="logoutButton" class="setting defaultButton">Logout</button><br>
            <button id='deleteUserButton' class="setting defaultButton">Delete Account</button>
        </div>
    </div>
    <div class="background"></div>
</body>
