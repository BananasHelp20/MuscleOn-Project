<!DOCTYPE html>
<html lang="en" style="background-color: #181818;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle ON! SignUp</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <link rel="stylesheet" type="text/css" href="./css/light.css" id="modeStylesheet">
    <link rel="stylesheet" type="text/css" href="./css/redesign.css">
    <script src="./script/motion.js"></script>
    <script src="./script/initalize.js" defer></script>
    <script src="./script/localStorage.js" defer></script>
    <script src="./script/router.js" defer></script>
    <script src="./script/helper.js" defer></script>
    <script src="./script/render.js" defer></script>
    <script src="./script/game.js" defer></script>
    <script src="./script/dev.js" defer></script>
    <script src="./script/feature.js" defer></script>
    <script src="./script/primary.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body style="background-color: transparent">
    <header>
        <div id="logoHolder"></div>
        <div id="actualHeaderHolder">
            <a id="menuLogo" class="menuObject" href="./index.html" aria-label="Muscle-ON! home">
                <img src="./images/logo.png" alt="Muscle-ON! logo">
            </a>
            <a id="title" href="./index.html">Muscle-ON!</a>
            <div id="menuBar">
                <div id="menuContainer">
                    <nav id="menuOptionBar" aria-label="Main navigation">
                        <a class="menuObject menuOption" href="./about.html"><span>About</span></a>
                        <a class="menuObject menuOption locked" href="./settings.html"><span>Settings</span></a>
                        <a class="menuObject menuOption locked" href="./session.html"><span>Session</span></a>
                        <a class="menuObject menuOption" href="./exercises.html"><span>Exercises</span></a>
                    </nav>
                    <div id="currentUser"></div>
                </div>
            </div>
        </div>
    </header>
    <div class="siteBody" id="signup-page">
        <h1>Signup</h1>
        <label for="userName">Benutzername:</label>
        <input type="text" id="userName" name="userName" class="styledInput" placeholder="Willi"><br><br>
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" class="styledInput" placeholder="!Passme123"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" class="styledInput" placeholder="email@server.at"><br><br>
        <label for="weight">Gewicht:</label>
        <input type="number" id="weight" name="weight" class="styledInput" placeholder="75"><br><br>
        <label for="size">Größe:</label>
        <input type="number" id="size" name="size" class="styledInput" placeholder="177"><br><br>
        <label for="birthday">Geburtstag:</label>
        <input type="date" id="birthday" name="birthday" class="styledInput"><br><br>
        <div class="plan-toggle">
            <label for="plan">Create a training plan</label>
            <input type="checkbox" id="plan" name="plan">
        </div>
        <div id="plan-section" class="table-wrapper" hidden>
            <div class="plan-section-heading">
                <h2>Training plan</h2>
                <button id="add-weekday" class="defaultButton">Add day</button>
            </div>
            <p>Set a weekly workout time and add exercises with rep and set goals. Reminders and attendance tracking are still in development.</p>
            <table id="plan-table-table">
                <thead>
                    <tr>
                        <th>Day of Week</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Muscle Group</th>
                        <th colspan="2">Actions</th>
                    </tr>
                </thead>
                <tbody id="plan-table"></tbody>
            </table>
            <div id="exercise-tables" class="table-wrapper" hidden>
                <h3>Exercises</h3>
            </div>
        </div>
        <button id="signupButton" class="defaultButton">Signup</button><br>
    </div>
    <div class="background"></div>
</body>
</html>
