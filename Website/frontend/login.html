<!DOCTYPE html>
<html lang="en" style="background-color: #181818;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle ON! Login</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <link rel="stylesheet" type="text/css" href="./css/light.css" id="modeStylesheet">
    <link rel="stylesheet" type="text/css" href="./css/redesign.css">
    <script src="./script/initalize.js" defer></script>
    <script src="./script/localStorage.js" defer></script>
    <script src="./script/router.js" defer></script>
    <script src="./script/helper.js" defer></script>
    <script src="./script/render.js" defer></script>
    <script src="./script/game.js" defer></script>
    <script src="./script/dev.js" defer></script>
    <script src="./script/feature.js" defer></script>
    <script src="./script/primary.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body style="background-color: transparent">
    <header>
        <div id="logoHolder"></div>
        <div id="actualHeaderHolder">
            <a id="menuLogo" class="menuObject" href="./index.html" aria-label="Muscle-ON! home">
                <img src="./images/logo.png" alt="Muscle-ON! logo">
            </a>
            <div id="title">Muscle-ON!</div>
            <div id="menuBar">
                <div id="menuContainer">
                    <nav id="menuOptionBar" aria-label="Main navigation">
                        <a class="menuObject menuOption" href="./about.html"><span>About</span></a>
                        <a class="menuObject menuOption locked" href="./settings.html"><span>Settings</span></a>
                        <a class="menuObject menuOption locked" href="./session.html"><span>Session</span></a>
                        <a class="menuObject menuOption" href="./exercises.html"><span>Exercises</span></a>
                    </nav>
                    <div id="currentUser"></div>
                </div>
            </div>
        </div>
    </header>
    <div class="siteBody" id="login-page">
        <h1>Login</h1>
        <label for="email">Username or email:</label>
        <input type="text" id="email" name="email" autocomplete="username"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <button id="loginButton" class="defaultButton">Login</button><br>
        Don't have a MuscleON Account? <a href="./signup.html" id="signupLink">sign up here</a>
    </div>
    <div class="background"></div>
</body>
</html>
