<!DOCTYPE html>
<html>
<head>
  <title>EMG Live</title>
</head>
<body>
  <h1>EMG Live Wert</h1>
  <h2 id="value">0</h2>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on("emg", (data) => {
      document.getElementById("value").innerText = data;
    });
  </script>
</body>
</html>
